[package]
name = "astrid"
version = "0.1.0"
edition = "2024"
description = "An experimental, inference-aware AI agent harness"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
libc = "0.2"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "net", "sync", "signal"] }
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"
