[package]
name = "astrid"
version = "0.1.0"
edition = "2024"
description = "An experimental, inference-aware AI agent harness"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
libc = "0.2"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "net", "sync", "signal"] }
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
ratatui-textarea = "0.9.3"
unicode-segmentation = "1"
ignore = "0.4"
png = "=0.18.1"
crc32fast = "1.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
vt100 = "0.16.2"

# The screenshot decode worker (`astrid __astrid_decode_png`) has a 2 s limit
# (ADR 0022). Unoptimized PNG code takes about 4 s on a full 1x screen, so the
# PNG crates are optimized even in debug builds (about 0.2 s).
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
