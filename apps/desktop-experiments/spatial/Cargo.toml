[package]
name = "astrid-spatial"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
anyhow = "=1.0.104"
async-channel = "=2.5.0"
raw-window-handle = "=0.6.2"
objc = "=0.2.7"
cocoa-foundation = "=0.2.0"
resvg = { version = "=0.45.1", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0

[lints.rust]
# objc 0.2's selector macro references this legacy cfg in consuming crates.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
