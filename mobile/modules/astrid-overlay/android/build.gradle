plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.astrid'
version = '0.1.0'

android {
  namespace "dev.astrid.overlay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
